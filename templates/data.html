<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collected Data</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container" style="max-width: 960px;">
    <h1>Collected Labels</h1>
    <p class="progress">{{ rows|length }} rows total</p>
    <table>
      <thead>
        <tr>
          <th>id</th>
          <th>participant_id</th>
          <th>tweet_id</th>
          <th>tweet_text</th>
          <th>chosen_label</th>
          <th>timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.participant_id }}</td>
          <td>{{ row.tweet_id }}</td>
          <td>{{ row.tweet_text }}</td>
          <td>{{ row.chosen_label }}</td>
          <td>{{ row.timestamp }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
